{% extends 'base.html' %}

{% block title %}Add Team Official{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header" style="background:linear-gradient(90deg,#00a04a,#00843d);color:white;">
                    <h5><i class="fas fa-user-plus"></i> Add Team Official</h5>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data" novalidate>
                        {% csrf_token %}
                        {% include "teams/partials/form_fields.html" %}

                        <div class="text-center">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-save"></i> Add Official
                            </button>
                            <a href="{% url 'teams:admin_manage_officials' %}" class="btn btn-secondary btn-lg">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
