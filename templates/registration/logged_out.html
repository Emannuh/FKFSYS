{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logged Out — FKF Meru County League</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="login-page">

  <div class="login-card" style="text-align:center;">
    <div class="login-card-header" style="background:linear-gradient(135deg,#198754,#0f5132);">
      <div class="login-logo" style="background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);">
        <i class="fas fa-check" style="color:white;"></i>
      </div>
      <h3>Logged Out</h3>
      <p>You've been securely signed out</p>
    </div>
    <div class="login-card-body">
      <p class="text-muted mb-4">
        Thank you for using the FKF Meru County League Management System.
      </p>
      <div class="d-flex gap-3 justify-content-center flex-wrap">
        <a href="{% url 'frontend:home' %}" class="btn btn-outline-secondary">
          <i class="fas fa-home me-1"></i>Homepage
        </a>
        <a href="{% url 'login' %}" class="btn login-btn" style="width:auto;padding:.6rem 1.5rem;">
          <i class="fas fa-sign-in-alt me-1"></i>Login Again
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
